version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: bulk-certificate-generator:latest
    container_name: bulk-certificate-generator
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=sqlite:///./data/certificates.db
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    volumes:
      # Persist SQLite database and generated certificate PDFs
      - app_data:/app/data
      - app_generated:/app/generated
    restart: unless-stopped

volumes:
  app_data:
  app_generated:
